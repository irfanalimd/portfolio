<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@500&family=Instrument+Serif:ital@1&display=swap">
  <style>
    :root { --bg: #f6f5f1; --text: #0f0f0f; --muted: #8e8b84; --accent: #e2470f; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #09090a; --text: #f0efeb; --muted: #6c6a66; --accent: #ff6a2b; color-scheme: dark; } }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font: 16px/1.6 "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 640px; }
    code { font: 500 .72rem "Geist Mono", ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 16px 0 14px; font-size: clamp(2.6rem, 8vw, 4.6rem); line-height: .92; letter-spacing: -.055em; font-weight: 600; }
    h1 em { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; color: var(--accent); }
    p { margin: 0 0 32px; color: var(--muted); font-size: 1.1rem; }
    a { display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border-radius: 999px; background: var(--text); color: var(--bg); text-decoration: none; font-weight: 500; transition: background .3s, color .3s; }
    a:hover { background: var(--accent); color: #fff; }
  </style>
</head>
<body>

    <h1>This page isn’t on the <em>map.</em></h1>

  </main>
</body>
</html>
